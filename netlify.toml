[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

[dev]
command = "npm run dev"
targetPort = 5173
port = 8888
framework = "#custom"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Put the public and server Supabase settings in Netlify's PRODUCTION context only.
# Preview builds/functions intentionally do not connect to the production database.
